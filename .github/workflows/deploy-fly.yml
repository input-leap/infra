name: Deploy infra to Fly.io
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  deploy:
    name: Deploy infrastructure object (${{ matrix.object }}) to Fly.io
    strategy:
      matrix:
        object: ["matterbridge"]
      fail-fast: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
        with:
          FLY_API_TOKEN: ${{ secrets.FLY_TOKEN }}
      - name: Deploy
        working-directory: ${{ matrix.object }}
        run: flyctl deploy
